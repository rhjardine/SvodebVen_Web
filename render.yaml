# Blueprint de Render (https://render.com/docs/blueprint-spec).
# Despliega el contenedor del Dockerfile + PostgreSQL. Los secretos (sync: false) se cargan en el
# panel de Render: nunca se versionan en el repositorio.
#
# Cada despliegue ejecuta primero `node dist/release.js` (crea/actualiza el esquema con las migraciones)
# y solo si termina bien arranca el servidor.
databases:
  - name: svodeb-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: [] # sin acceso externo: solo la red privada de Render

services:
  - type: web
    name: svodeb-web
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    dockerCommand: sh -c "node dist/release.js && node dist/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Cadena de conexión interna de la base. Con un solo usuario (el que da Render) se usa para
      # migrar y para la aplicación ("rol único", RLS forzada). Ver docs/DESPLIEGUE.md §4b.
      - key: DATABASE_URL
        fromDatabase:
          name: svodeb-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SECRETARIA_EMAIL
        sync: false
